# Product Intelligence OS — Project State Schema
#
# One file per run, at projects/<slug>/state.yaml.
# This is the framework's memory. Every module reads it before starting and
# writes to it before its gate is evaluated. Without it, each module reasons in
# isolation and the deliverables contradict each other.

version: 1

project:
  slug: ""                      # kebab-case, used as the directory name
  raw_idea: ""                  # the operator's original words, never rewritten
  created: ""                   # ISO date, supplied by the operator
  jurisdiction: ""              # drives regulatory research — must be set in 01-idea
  language: en

  # What the product physically is: web | mobile | web+mobile | desktop | api | other.
  # An operator answer, never an inference — 01-idea gate criterion 3. Where more than one
  # surface is named, `order` records which ships first. Eight modules read this as settled
  # context and none re-examines it, so a default here is inherited rather than corrected.
  delivery_surface: ""
  delivery_order: ""            # e.g. "web, then Android, then iOS" — empty if single-surface

  # Absolute paths, written once when the run is created. A later session reads
  # them instead of re-deriving, so resume works even when PIOS_HOME is set
  # differently — or not at all — in that session.
  framework_path: ""            # .../pios/framework
  run_dir: ""                   # .../projects/<slug>  or  .../pios/<slug>

run:
  current_stage: frame
  completed_modules: []
  confidence: unknown           # high | medium | low | unknown

  # Why that level, and what specifically would raise it. A confidence word with no basis
  # is a mood. The Executive Summary opens with both, so this is where it comes from.
  confidence_basis: ""

  # Every gate evaluation, pass and fail alike. `failed_gates` records only the failures,
  # which makes a run look like it passed everything except where noted — the opposite of
  # an audit trail. A verdict names the module, the attempt, each criterion's result, and
  # the universal gates.
  #
  # A pass recorded with no criterion-level detail is a claim, not a verdict.
  gate_verdicts: []
  # - module: 05-competition
  #   attempt: 1
  #   at: ""
  #   verdict: pass                 # pass | fail
  #   criteria: {}                  # {criterion_text: pass | fail}
  #   universal: []                 # [U1, U2, ...] evaluated
  #   attempt_counted: true         # false for a decision_dependent_failure
  #   shortfall_declared: false

  # Which human_checkpoint the run is paused at, if any, and what the operator was asked.
  # Cleared when they answer. A run resumed a week later reads this before anything else.
  current_checkpoint: null

  # Set when a gate halts the run. `halted_at` is the module id; `halt_reason` states what
  # is missing and who owns it. Both are cleared when the halt is resolved — the permanent
  # record lives in failed_gates, which is append-only. A halt still set at delivery means
  # the run finished around a gate it never cleared, and must say so in the summary.
  halted_at: null
  halt_reason: ""

  # [{module, attempt, reason, at, attempt_counted}]
  #
  # `attempt_counted: false` marks a decision-dependent failure — the criterion is unmet
  # because the operator has not made a choice, and no further research produces one. Those
  # do not consume the three attempts in engine/gates.yaml `loop_protection`, because a
  # re-run fails identically and the run would halt for exhaustion while reporting a
  # research failure that never happened. See `decision_dependent_failure`.
  failed_gates: []

# Populated by modules. Keys match the `produces` list in each module.yaml.
outputs: {}

# Every claim the run depends on, tagged per engine/evidence-policy.md.
#
# `n` and `strength` exist because a tag is not a scale. A finding from one
# conversation and a finding from two hundred are both [verified], and without
# these fields they are weighted identically by every module downstream.
#
# `mode` distinguishes what was watched from what was described. They are not
# equivalent evidence and 03-user's gate now requires the distinction.
#
# `checked_on` is what makes a reused run safe. A regulation or a price is
# correct on the day it was captured and decays silently afterward.
evidence_log:
  # - claim: "Global EMR market was USD 29.8B in 2023"
  #   tag: verified          # verified | inferred | assumption
  #   source: "Grand View Research, 2024"
  #   checked_on: ""         # ISO date the source was consulted
  #   module: 02-market
  #   n: null                # sample size where the claim rests on observation
  #   mode: null             # observed | reported — for user and workflow claims
  #   strength: null         # strong | moderate | weak — the author's own read
  #   load_bearing: true

# Things believed but not established. Carried into the final deliverables.
assumptions:
  # - id: A1
  #   statement: "Solo practitioners will pay USD 40/month"
  #   module: 06-business
  #   impact: "Sets the entire pricing model"
  #   validation: "Price-sensitivity interviews with 10 solo GPs"
  #   status: open        # open | validated | invalidated

# Questions the agent could not answer alone.
#
# `answered_at` matters as much as `answer`. A question answered after the module that
# raised it has passed means every module since ran on a substitute assumption — see
# engine/gates.yaml `late_answer_rederivation`.
#
# `blocking` and `premise_bearing` are DIFFERENT properties and both are required:
#
#   blocking        — the run cannot proceed until this is answered.
#   premise_bearing — the run can proceed by assuming an answer, and later conclusions
#                     will rest on that assumption.
#
# A question can be premise_bearing without being blocking, and that combination is the
# dangerous one: work continues, nothing halts, and the substitute quietly becomes the
# premise of everything downstream. Classify when the question is RAISED — by answering
# time the substitution has happened and is hard to see. When it cannot be determined,
# premise_bearing is true.
open_questions:
  # - question: "Is this replacing an EMR or sitting alongside one?"
  #   raised_by: 01-idea
  #   blocking: true
  #   premise_bearing: true   # will any module proceed by assuming an answer?
  #   owner: operator
  #   answer: null
  #   answered_at: null       # ISO date. Later than raised_by's gate = re-derivation owed
  #   substitute_assumption: null   # the assumption id modules used in its place

# Written when a blocking question is answered late and the run re-derives rather than
# find-and-replaces. Absent when nothing was answered late — which is the normal case.
rederivations:
  # - at: ""
  #   trigger: "Q8 (team size) answered at the delivery checkpoint"
  #   premise_change: {was: "", now: ""}
  #   conclusions_retested:
  #     - conclusion: ""
  #       verdict: survived   # survived | changed | withdrawn
  #       same_reason: false  # a survivor that survives for a new reason has changed
  #   superseded_assumptions: []
  #   deliverables_reissued: []
  #   unchanged_and_why: []

# Defects found in a deliverable AFTER the module that produced it passed its gate —
# usually at review, at a checkpoint, or when the operator reads the finished set.
#
# Distinct from rederivations, which record a premise that changed. Here the premise held
# and the artifact was wrong anyway: two statements that were each coherent and did not
# resolve against each other, a rule stated in three places and enforced in none, a figure
# that drifted after it was written.
#
# `now_caught_by` is the field that matters. A correction without it fixes one run; with
# it, the defect class is closed for every run afterwards. If nothing catches it yet, say
# so — that entry is a candidate for /pios-author, and naming the gap is the point.
corrections:
  # - at: ""
  #   found_by: review        # review | checkpoint | operator | later module
  #   defect: "The append-only DDL named a table the schema never created"
  #   artifacts: []
  #   fix: ""
  #   now_caught_by: "validate-run.py identifier check"   # or: nothing yet

# Where the framework got in the run's way. Appended during the run, at the moment it
# happens — not reconstructed at the end, when the friction has been worked around and
# forgotten.
#
# This exists because the operator should not have to remember, three hours later, what
# annoyed them at module 04. The run notices, records, and hands the list back at delivery.
#
# It is run content: private, gitignored, and never published. A lesson crosses into the
# framework through /pios-author, generalized so the project does not travel with it.
friction_log:
  # - at: 01-idea
  #   kind: gate            # gate | template | question | checkpoint | tooling | unclear
  #   what: "Criterion 4 could not be evaluated — no way to tell a deferred question from
  #          an unanswered one in state.open_questions"
  #   cost: "Judged it by hand. A second run would judge it differently"
  #   operator_visible: false   # true if the operator hit it, not just the agent

# Decisions made, with the reasoning preserved. This is what makes the output auditable.
decisions:
  # - id: D1
  #   decision: "Wedge on ambient capture, not records management"
  #   module: 07-strategy
  #   rationale: "Ranked problem P1 is consultation-time data entry, not retrieval"
  #   alternatives_rejected: ["Full EMR replacement", "Billing-first"]
  #   reversible: true

# Recorded before scoring begins in 07-strategy, and never edited afterward.
# Confidence laundering cannot be detected inside one document — the laundered
# and the honest version are identical. It can be detected across runs. If the
# expected winner always wins, the comparison is recording a decision rather
# than making one.
pre_registration:
  # - module: 07-strategy
  #   question: "Which solution option do we expect to win?"
  #   expected: "Option A — the AI product"
  #   recorded_before: scoring
  #   actual: null            # filled after the comparison completes
  #   matched: null           # true | false

rules:
  - raw_idea is immutable. Refinements go to outputs.idea_brief.
  - A pre_registration entry is written before the work it predicts, and never edited after.
  - A module appends to evidence_log. It never rewrites another module's entries.
  - A blocking open_question halts the run at the next human_checkpoint.
  - >-
    Every open_question carries both blocking and premise_bearing. They are different
    properties and a question can be the second without the first.
  - >-
    A blocking OR premise_bearing open_question answered after its module passed forces a
    re-derivation, not a find-and-replace. Record it in rederivations.
  - >-
    A gate failure whose missing input is an operator decision is recorded with
    attempt_counted: false and does not consume a loop-protection attempt.
  - Every decision records the alternatives it rejected, or it is not a decision.
  - >-
    Write to the key this schema defines. Recording the right content under an invented key
    is invisible to every check that reads the defined one.
