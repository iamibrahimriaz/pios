# Product Intelligence OS — Project State Schema
#
# One file per run, at projects/<slug>/state.yaml.
# This is the framework's memory. Every module reads it before starting and
# writes to it before its gate is evaluated. Without it, each module reasons in
# isolation and the deliverables contradict each other.

version: 1

project:
  slug: ""                      # kebab-case, used as the directory name
  raw_idea: ""                  # the operator's original words, never rewritten
  created: ""                   # ISO date, supplied by the operator
  jurisdiction: ""              # drives regulatory research — must be set in 01-idea
  language: en

  # What the product physically is: web | mobile | web+mobile | desktop | api | other.
  # An operator answer, never an inference — 01-idea gate criterion 3. Where more than one
  # surface is named, `order` records which ships first. Eight modules read this as settled
  # context and none re-examines it, so a default here is inherited rather than corrected.
  delivery_surface: ""
  delivery_order: ""            # e.g. "web, then Android, then iOS" — empty if single-surface

  # Absolute paths, written once when the run is created. A later session reads
  # them instead of re-deriving, so resume works even when PIOS_HOME is set
  # differently — or not at all — in that session.
  framework_path: ""            # .../pios/framework
  run_dir: ""                   # .../projects/<slug>  or  .../pios/<slug>

run:
  current_stage: frame
  completed_modules: []
  failed_gates: []              # [{module, attempt, reason, at}]
  confidence: unknown           # high | medium | low | unknown

# Populated by modules. Keys match the `produces` list in each module.yaml.
outputs: {}

# Every claim the run depends on, tagged per engine/evidence-policy.md.
#
# `n` and `strength` exist because a tag is not a scale. A finding from one
# conversation and a finding from two hundred are both [verified], and without
# these fields they are weighted identically by every module downstream.
#
# `mode` distinguishes what was watched from what was described. They are not
# equivalent evidence and 03-user's gate now requires the distinction.
#
# `checked_on` is what makes a reused run safe. A regulation or a price is
# correct on the day it was captured and decays silently afterward.
evidence_log:
  # - claim: "Global EMR market was USD 29.8B in 2023"
  #   tag: verified          # verified | inferred | assumption
  #   source: "Grand View Research, 2024"
  #   checked_on: ""         # ISO date the source was consulted
  #   module: 02-market
  #   n: null                # sample size where the claim rests on observation
  #   mode: null             # observed | reported — for user and workflow claims
  #   strength: null         # strong | moderate | weak — the author's own read
  #   load_bearing: true

# Things believed but not established. Carried into the final deliverables.
assumptions:
  # - id: A1
  #   statement: "Solo practitioners will pay USD 40/month"
  #   module: 06-business
  #   impact: "Sets the entire pricing model"
  #   validation: "Price-sensitivity interviews with 10 solo GPs"
  #   status: open        # open | validated | invalidated

# Questions the agent could not answer alone.
#
# `answered_at` matters as much as `answer`. A blocking question answered after the
# module that raised it has passed means every module since ran on a substitute
# assumption — see engine/gates.yaml `late_answer_rederivation`.
open_questions:
  # - question: "Is this replacing an EMR or sitting alongside one?"
  #   raised_by: 01-idea
  #   blocking: true
  #   answer: null
  #   answered_at: null       # ISO date. Later than raised_by's gate = re-derivation owed
  #   substitute_assumption: null   # the assumption id modules used in its place

# Written when a blocking question is answered late and the run re-derives rather than
# find-and-replaces. Absent when nothing was answered late — which is the normal case.
rederivations:
  # - at: ""
  #   trigger: "Q8 (team size) answered at the delivery checkpoint"
  #   premise_change: {was: "", now: ""}
  #   conclusions_retested:
  #     - conclusion: ""
  #       verdict: survived   # survived | changed | withdrawn
  #       same_reason: false  # a survivor that survives for a new reason has changed
  #   superseded_assumptions: []
  #   deliverables_reissued: []
  #   unchanged_and_why: []

# Decisions made, with the reasoning preserved. This is what makes the output auditable.
decisions:
  # - id: D1
  #   decision: "Wedge on ambient capture, not records management"
  #   module: 07-strategy
  #   rationale: "Ranked problem P1 is consultation-time data entry, not retrieval"
  #   alternatives_rejected: ["Full EMR replacement", "Billing-first"]
  #   reversible: true

# Recorded before scoring begins in 07-strategy, and never edited afterward.
# Confidence laundering cannot be detected inside one document — the laundered
# and the honest version are identical. It can be detected across runs. If the
# expected winner always wins, the comparison is recording a decision rather
# than making one.
pre_registration:
  # - module: 07-strategy
  #   question: "Which solution option do we expect to win?"
  #   expected: "Option A — the AI product"
  #   recorded_before: scoring
  #   actual: null            # filled after the comparison completes
  #   matched: null           # true | false

rules:
  - raw_idea is immutable. Refinements go to outputs.idea_brief.
  - A pre_registration entry is written before the work it predicts, and never edited after.
  - A module appends to evidence_log. It never rewrites another module's entries.
  - A blocking open_question halts the run at the next human_checkpoint.
  - A blocking open_question answered after its module passed forces a re-derivation, not a
    find-and-replace. Record it in rederivations.
  - Every decision records the alternatives it rejected, or it is not a decision.
