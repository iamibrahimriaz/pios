# Product Intelligence OS — Gate Policy
#
# Per-module gate criteria live in each module's module.yaml.
# This file defines how gates are evaluated, and the universal gates that apply
# to every module regardless of domain.

version: 1

# Applied to every module, in addition to its own gate list.
universal:
  - id: U1
    rule: Every factual claim carries exactly one evidence tag.
    reference: engine/evidence-policy.md
  - id: U2
    rule: Every output named in the module's `produces` list exists in state.outputs.
  - id: U3
    rule: No claim contradicts an earlier entry in state.evidence_log without explicitly superseding it.
  - id: U4
    rule: Every decision records the alternatives it rejected.
  - id: U5
    rule: Assumptions introduced by this module are appended to state.assumptions with a validation method.
  - id: U6
    rule: Output is written for a reader with no access to this conversation.
  - id: U7
    rule: >
      Every control the module declares load-bearing names where it executes, and that
      place exists in the specified design.
    detail: >
      A control is a rule the output says the product depends on: a constraint, an
      invariant, a derivation, a check, a permission. U7 asks one question of each —
      which named component enforces this, and is that component specified anywhere in
      the artifact set?

      "Computed in the business timezone, never UTC" is not a specification. It is a
      wish until an artifact names the endpoint that derives the value, or the field is
      removed from the client's request body so it cannot be supplied instead.

      This is the gate for the class of defect where a rule is stated emphatically in
      three documents and enforced in none. It is invisible to U1-U6, because nothing is
      unsourced, contradicted or ambiguous — the enforcement point simply does not exist,
      and no criterion asked for it.
    fails_when:
      - A rule is called critical, load-bearing or non-negotiable and names no mechanism.
      - The named mechanism is a layer rather than a component — "the application layer".
      - The mechanism contradicts another artifact, most commonly a value the rule says
        is derived that an interface accepts as input.

evaluation:
  method: self_review_then_gate
  steps:
    - Produce the module output.
    - Run the module's own review loop (engine/review-loop.md).
    - Evaluate universal gates U1–U7.
    - Evaluate the module's gate list from module.yaml.
    - Record pass or fail in state.run.
  verdict:
    pass: All universal and module gates satisfied.
    fail: Any gate unsatisfied. Follow module.on_fail.
  honesty_rule: >
    A gate is failed by default when its status cannot be determined.
    Uncertainty is a fail, not a pass. A gate that never fails is not a gate.

declared_shortfall:
  # A narrow, deliberate exception. Some criteria require evidence an agent may be
  # unable to obtain — most often primary research. Demanding it unconditionally
  # would not produce evidence; it would produce fabricated evidence.
  #
  # A criterion may be marked declared_shortfall ONLY when all of the following hold.
  allowed_when:
    - The criterion requires evidence the agent has no means of obtaining.
    - The actual position is stated plainly in the module output, not implied.
    - Confidence is lowered accordingly.
    - The shortfall is recorded in the gate verdict as `shortfall_declared: true`.
    - A validation task that would close the gap is added to state.open_questions.
  prohibited_when:
    - The evidence was obtainable and the agent did not look.
    - The shortfall is concealed, softened, or buried below other findings.
    - It is used to bypass a criterion about rigor rather than about evidence access.
  consequence: >
    A run carrying any declared shortfall must surface it in the Executive Summary
    and in Risks-and-Assumptions. Where the shortfall concerns problem validation,
    the Roadmap must open with a Milestone Zero that validates before building.
  currently_permitted_for:
    - module: 04-problem
      criterion: ">= 3 problems carrying [verified] evidence"
      reason: Verification may be impossible without primary user research.

loop_protection:
  max_attempts_per_module: 3
  on_exhaustion: >
    Halt the run. Write the reason to state.run.failed_gates and escalate to the
    human operator with a specific question. Do not proceed with a failed gate.
  # Attempts are for defects the module can repair. A gate whose missing input is an
  # operator decision cannot be repaired by re-running it — see decision_dependent_failure.

decision_dependent_failure:
  # Loop protection assumes a failed gate is a research defect: look harder, reason
  # better, try again. Some failures are not that. The criterion is unmet because a
  # decision only the operator can make has not been made, and no amount of further
  # research produces it.
  #
  # Counting those as attempts spends the run's three tries on a question the run cannot
  # answer, and then halts for exhaustion — reporting a research failure when the actual
  # state is "waiting on a person". The operator reads it as the framework failing, and
  # the real request never gets asked.
  applies_when:
    - The gate criterion is unmet, and the missing input is a choice rather than a finding.
    - No further research changes the verdict. State what research would be run and why
      its result cannot move the criterion — if that cannot be stated, this is an
      ordinary failure and the attempt counts.
    - The decision belongs to the operator by authority, not merely by convenience.
  prohibited_when:
    - Research was available and was not done. Difficulty is not the same as impossibility.
    - The agent is declaring a decision-dependency to avoid a criterion about rigor.
    - The "decision" is one the research was commissioned to inform. A recommendation the
      operator must approve is still the run's to produce — see the counter-example below.
  required_response:
    - Do not increment the attempt counter. Record `attempt_counted: false` in the verdict.
    - >-
      Record the decision as an open_question with blocking and premise_bearing both true,
      and the operator as owner. State the options and what each one implies, so the
      operator is choosing between consequences rather than being asked an open question.
    - Halt the module. A decision-dependent failure is still a failure; the run does not
      proceed past it on the assumption that the answer will be convenient.
    - If the operator defers the decision, the gate stays failed and the run may continue
      only into work that does not depend on it. Say plainly which deliverables are
      complete regardless and which are waiting.
  counter_example: >
    "Which of these three segments should we target?" is NOT decision-dependent. Choosing
    it is the work 07-strategy exists to do, and handing it back is the module declining
    its own purpose. "What price will you charge, given the research cannot establish what
    the problem costs anyone?" IS decision-dependent — the input is missing from the world,
    not from the analysis.
  consequence: >
    A run carrying an unresolved decision-dependent failure at delivery must name it in the
    Executive Summary as an open decision with its options, and set confidence accordingly.
    It must not be presented as a research gap, because no research closes it.

premise_bearing_questions:
  # `blocking` and `premise_bearing` are different properties, and conflating them is
  # how a contradicted premise reaches a delivery checkpoint unnoticed.
  #
  #   blocking        — the run cannot proceed until this is answered.
  #   premise_bearing — the run CAN proceed, by substituting an assumption, and later
  #                     conclusions will rest on that substitute.
  #
  # A question can be the second without being the first. "How many people will build
  # this?" does not stop market research; it silently sets the cost base that the business
  # model, the growth ceiling and the executive summary's central argument are derived
  # from. Answer it late and every one of those is a conclusion about a different company.
  #
  # Classified when the question is RAISED, not when it is answered. By answering time the
  # substitution has already happened and is hard to see.
  test: >
    Will any module proceed by assuming an answer? If yes, the question is premise_bearing,
    whatever its blocking status. The substitute assumption is the evidence: a question no
    module needed to assume an answer to was genuinely optional.
  default: >
    premise_bearing: true when it cannot be determined. Uncertainty is a fail, not a pass —
    the cost of a false positive is one re-derivation that finds nothing moved; the cost of
    a false negative is a deliverable set arguing from a premise the operator has denied.
  recorded_as: >
    open_questions[].premise_bearing, alongside blocking. When a module substitutes an
    assumption, it writes that assumption's id to open_questions[].substitute_assumption.
  examples:
    premise_bearing_but_not_blocking:
      - Who is building this, and how many of them — it sets the fixed cost base.
      - Is this a business, a side project, or an internal tool — it sets what success means.
      - Is the technology already chosen — it sets what the architecture may assume.
    blocking_but_not_premise_bearing:
      - Which jurisdiction — nothing can be assumed in its place, so research halts instead.
    neither:
      - Preferences that change wording rather than reasoning.

late_answer_rederivation:
  # A question raised in an early module is sometimes answered late — at a checkpoint, or
  # when the operator reads the finished set. By then every module that ran without the
  # answer has substituted an assumption for it, and those assumptions are load-bearing
  # precisely because the question mattered.
  #
  # Find-and-replace is the wrong repair. It corrects the words and leaves the
  # conclusions standing on the premise the operator has just contradicted — which reads
  # as agreement with the new answer while being derived from the old one.
  trigger: >
    Any open_question with blocking: true OR premise_bearing: true receives an answer after
    the module that raised it has passed its gate. Also triggered, regardless of either
    flag, when an answer contradicts an assumption already recorded in state.assumptions —
    a question misclassified at raise time is still a re-derivation at answer time.
  required_response:
    - Identify every module that recorded an assumption in place of the answer.
      state.assumptions carries the module id; the substitute assumption is the one whose
      statement answers the question.
    - Re-derive each affected conclusion from the new premise. Do not edit the wording of
      a conclusion whose reasoning has not been re-run.
    - State, per conclusion, whether it survived, changed, or was withdrawn — and for a
      survivor, whether the reason it survived is still the original reason. A conclusion
      that survives for a different reason has changed.
    - Supersede the substitute assumption rather than deleting it, so the run records what
      it believed and for how long.
    - Append a record to state.rederivations.
  applies_to_deliverables: >
    Every artifact whose argument used the substitute assumption is re-issued at a new
    version. An artifact whose findings do not move is left at its existing version and
    said to be unchanged — evidence does not change when a premise does.
  not_triggered_by:
    - A question that is neither blocking nor premise_bearing, and whose answer contradicts
      no recorded assumption. Record the answer and continue.
    - New evidence that confirms the substitute assumption. Mark the assumption validated.
  # An earlier version of this policy excluded every non-blocking question here. That
  # exclusion is what let a run reach delivery with seven artifacts arguing from a premise
  # the operator had already contradicted: the question was non-blocking, so the gate
  # written for exactly this situation was the one that did not fire.

human_checkpoints:
  # Stages where the run pauses for operator confirmation before continuing.
  - stage: frame
    reason: Clarifying questions must be answered by a human before research begins.
  - stage: decide
    reason: The MVP cut line is a commercial commitment, not a research finding.
  - stage: deliver
    reason: Final artifacts are reviewed before handoff.

degraded_mode:
  # When the agent has no retrieval capability.
  allowed: true
  conditions:
    - All unverifiable claims tagged [assumption: needs validation].
    - state.run.confidence set to low.
    - Executive Summary opens with the confidence level and what would raise it.
  prohibited:
    - Presenting an unverified figure as verified.
    - Omitting a required section because it could not be researched.
