# Product Intelligence OS — Run Order
#
# The sequence an agent executes for a single project run.
# Modules are grouped into stages. Everything in a stage may run in any order,
# but a stage may not begin until the previous stage has passed its gates.

version: 1

stages:
  - id: frame
    purpose: Understand what is actually being proposed before researching anything.
    modules: [01-idea]
    human_checkpoint: true          # clarifying questions go back to the operator

  - id: research
    purpose: Establish the evidence base.
    modules: [02-market, 03-user, 04-problem, 05-competition]
    notes: >
      03-user and 04-problem are sequential; 02-market may run alongside them.
      05-competition requires all three.

  - id: decide
    purpose: Convert evidence into a committed direction.
    modules: [06-business, 07-strategy]
    human_checkpoint: true          # the MVP cut is the operator's call to confirm

  - id: specify
    purpose: Make the direction precise enough to build.
    modules: [08-product, 09-technology, 14-ai-systems]

  - id: operationalise
    purpose: Make it executable, measurable and runnable.
    modules: [10-execution, 11-growth, 12-metrics, 13-operations]

  - id: deliver
    purpose: Assemble, review and emit the final artifact set.
    modules: []
    action: framework/deliverables/manifest.yaml
    human_checkpoint: true

  - id: completion
    # AUTOMATIC, on every completed run. Not offered, not conditional on the verdict.
    #
    # A completed run has to be understood by several different readers and no single document
    # serves them all. The artifact set above is written for the builder. The person who
    # decides whether the build is funded will not read sixteen files and is answering a
    # different question — approve, defer, or reject. Someone else decides in five minutes
    # whether to open the proposal at all. An agent opening the folder needs to know what to
    # read first and what not to touch, which is different again.
    #
    # It was optional once, and that was the defect: the operator assembled the proposal by
    # hand, and what fell out was the confidence level, the open decisions, the stop
    # conditions and any gate that failed.
    #
    # Derived, never re-researched: every figure already exists in the artifact set. A run
    # that reached "do not build" produces all of them anyway — stopping is also a decision
    # someone has to sign, and the entry file's first job is then to say the build is blocked.
    #
    # The entry file copies nothing. A subset assembled into a staging folder or a second
    # repository puts two copies of the same specification in play with nothing keeping them
    # aligned, and the build proceeds from whichever went stale. Which documents a builder
    # reads first is solved by stating a reading order, not by selecting files.
    #
    # THE MANIFEST IS THE LIST, NOT THIS BLOCK. `methods` below names where each is specified;
    # `completion_artifacts` in the manifest is what decides which are owed. When the two
    # disagree, an artifact declared required is silently never produced — this list held three
    # entries while the manifest declared five, and nothing reported it.
    purpose: >-
      Emit one artifact per audience — the five-minute decision maker, the approver, the
      engineering team, whoever asks what may be started, and the AI agent opening the folder.
    modules: []
    action: framework/deliverables/manifest.yaml   # completion_artifacts — the authoritative list
    methods:
      - framework/engine/decision-report.md  # DECISION.md, one page, at the run root
      - framework/engine/proposal.md         # project proposal, HTML
      - framework/engine/presentation.md     # engineering kickoff, PPTX
      - framework/engine/phases.md           # phases/ — the board and one document per milestone
      - framework/engine/handoff.md          # AI entry file at the run root
      - framework/engine/milestone-zero.md   # milestone-zero/ — CONDITIONAL, see the manifest

rules:
  - A module may not start until every id in its depends_on has passed its gate.
  - A module writes its outputs to projects/<slug>/state.yaml before its gate is evaluated.
  - A failed gate follows the module's on_fail target. Never proceed on a failed gate.
  - A module may be re-entered. Re-entry appends to the evidence log, it does not overwrite it.
  - Loop protection: if a module fails its gate three times, halt and escalate to the operator.
