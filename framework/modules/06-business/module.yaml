id: 06-business
name: Business
purpose: Establish whether a viable business exists around the solution.
depends_on: [02-market, 03-user, 05-competition]
consumes: [tam_sam_som, pricing_comparison, segments]
produces: [business_model, pricing_strategy, unit_economics, go_to_market, revenue_model]
feeds_deliverables: [executive-summary, growth-plan, prd, research-dossier]
gate:
  - Payer identified and distinguished from the user
  - Price point justified against competitor pricing and value delivered
  - Unit economics stated with assumptions surfaced
  - Path to first 10 customers described
on_fail: return to 05-competition
