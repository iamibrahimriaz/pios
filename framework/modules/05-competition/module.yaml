id: 05-competition
name: Competition
purpose: Map who already solves this, how well, and where the opening is.
depends_on: [02-market, 03-user, 04-problem]
consumes: [market_definition, segments, ranked_problems]
produces: [competitor_matrix, feature_comparison, pricing_comparison, gap_analysis, positioning]
feeds_deliverables: [research-dossier, executive-summary, prd]
gate:
  - >= 5 competitors, direct and indirect, with sources
  - Pricing captured or explicitly marked unavailable
  - "Do nothing / status quo" evaluated as a competitor
  - >= 1 defensible gap articulated with reasoning
on_fail: return to 02-market
