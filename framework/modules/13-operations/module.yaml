id: 13-operations
name: Operations
purpose: Plan how the product is run, supported and kept compliant after launch.
depends_on: [02-market, 09-technology, 10-execution]
consumes: [delivery_plan, security_model, regulatory_landscape]
produces: [support_model, runbooks, incident_process, compliance_operations, cost_model]
feeds_deliverables: [build-handoff, engineering-setup, operations-plan]
gate:
  - Support channel and response expectation defined
  - Incident and escalation path documented
  - Ongoing compliance obligations mapped to an owner and a cadence
  - Running cost estimated at launch scale
  - A cost ceiling breach is resolved by a recorded change to 06-business price or 07-strategy scope, never by revising the forecast
on_fail: return to 10-execution
