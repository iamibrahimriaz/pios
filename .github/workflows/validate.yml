name: validate

# The framework is prose, so nothing compiles and nothing has tests in the usual
# sense. This is the only automated check there is — it verifies the structure
# every module and deliverable depends on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Framework structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the framework
        run: python3 framework/engine/validate.py

      # Check 22 above already fails if run content is tracked. This repeats it
      # as its own step so a leaked run is unmistakable in the checks list rather
      # than one line inside a passing-looking validator run.
      - name: No run content in the repository
        run: |
          leaked=$(git ls-files projects examples | grep -v 'README.md$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Run content is tracked. Runs are private and are never committed."
            echo "$leaked"
            exit 1
          fi
          echo "No run content tracked."
